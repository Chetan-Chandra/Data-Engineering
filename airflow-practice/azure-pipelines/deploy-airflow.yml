parameters:
- name: airflow_bucket
  type: string

steps:

# ==================================================================================================
# GCP AUTHENTICATION
# ==================================================================================================

- task: DownloadSecureFile@1
  name: google_credentials
  inputs:
    secureFile: 'practice-gcp-service-account.json'
  displayName: 'Download GCP Service Account Key'

- script: |
    gcloud auth activate-service-account \
      --key-file=$(google_credentials.secureFilePath)
  displayName: 'Authenticate with GCP'


# ==================================================================================================
# DEPLOY DAG FILES
# ==================================================================================================

- script: |
    echo "Deploying changed DAG files..."
    echo "Target bucket: gs://${{ parameters.airflow_bucket }}"

    git diff --name-status -M HEAD~1 HEAD |
    while read -r status old_path new_path
    do

      # --------------------------------------------------------------------------------------------
      # RENAMED DAG
      # --------------------------------------------------------------------------------------------

      if [[ "$status" == R* ]]; then

        if [[ "$old_path" != airflow-practice/DAGS/* ||
              "$new_path" != airflow-practice/DAGS/* ]]
        then
          continue
        fi

        old_relative="${old_path#airflow-practice/DAGS/}"
        new_relative="${new_path#airflow-practice/DAGS/}"

        echo "Renamed DAG:"
        echo "$old_relative -> $new_relative"

        gcloud storage rm \
          "gs://${{ parameters.airflow_bucket }}/dags/$old_relative" \
          --quiet \
          || true

        gcloud storage cp \
          "$(Build.SourcesDirectory)/airflow-practice/DAGS/$new_relative" \
          "gs://${{ parameters.airflow_bucket }}/dags/$new_relative"

        continue
      fi


      # --------------------------------------------------------------------------------------------
      # ONLY PROCESS A / M / D
      # --------------------------------------------------------------------------------------------

      if [[ "$status" != "A" &&
            "$status" != "M" &&
            "$status" != "D" ]]
      then
        continue
      fi

      if [[ "$old_path" != airflow-practice/DAGS/* ]]
      then
        continue
      fi

      relative_path="${old_path#airflow-practice/DAGS/}"

      echo "DAG status: $status"
      echo "DAG: $relative_path"


      # --------------------------------------------------------------------------------------------
      # DELETED DAG
      # --------------------------------------------------------------------------------------------

      if [[ "$status" == "D" ]]; then

        gcloud storage rm \
          "gs://${{ parameters.airflow_bucket }}/dags/$relative_path" \
          --quiet \
          || true

      # --------------------------------------------------------------------------------------------
      # ADDED / MODIFIED DAG
      # --------------------------------------------------------------------------------------------

      else

        gcloud storage cp \
          "$(Build.SourcesDirectory)/airflow-practice/DAGS/$relative_path" \
          "gs://${{ parameters.airflow_bucket }}/dags/$relative_path"

      fi

    done
  displayName: 'Deploy Changed DAG Files'


# ==================================================================================================
# DEPLOY PLUGIN FILES
# ==================================================================================================

- script: |
    echo "Deploying changed plugin files..."
    echo "Target bucket: gs://${{ parameters.airflow_bucket }}"

    git diff --name-status -M HEAD~1 HEAD |
    while read -r status old_path new_path
    do

      # --------------------------------------------------------------------------------------------
      # RENAMED PLUGIN
      # --------------------------------------------------------------------------------------------

      if [[ "$status" == R* ]]; then

        if [[ "$old_path" != airflow-practice/plugins/* ||
              "$new_path" != airflow-practice/plugins/* ]]
        then
          continue
        fi

        old_relative="${old_path#airflow-practice/plugins/}"
        new_relative="${new_path#airflow-practice/plugins/}"

        echo "Renamed plugin:"
        echo "$old_relative -> $new_relative"

        gcloud storage rm \
          "gs://${{ parameters.airflow_bucket }}/plugins/$old_relative" \
          --quiet \
          || true

        gcloud storage cp \
          "$(Build.SourcesDirectory)/airflow-practice/plugins/$new_relative" \
          "gs://${{ parameters.airflow_bucket }}/plugins/$new_relative"

        continue
      fi


      # --------------------------------------------------------------------------------------------
      # ONLY PROCESS A / M / D
      # --------------------------------------------------------------------------------------------

      if [[ "$status" != "A" &&
            "$status" != "M" &&
            "$status" != "D" ]]
      then
        continue
      fi

      if [[ "$old_path" != airflow-practice/plugins/* ]]
      then
        continue
      fi

      relative_path="${old_path#airflow-practice/plugins/}"

      echo "Plugin status: $status"
      echo "Plugin: $relative_path"


      # --------------------------------------------------------------------------------------------
      # DELETED PLUGIN
      # --------------------------------------------------------------------------------------------

      if [[ "$status" == "D" ]]; then

        gcloud storage rm \
          "gs://${{ parameters.airflow_bucket }}/plugins/$relative_path" \
          --quiet \
          || true

      # --------------------------------------------------------------------------------------------
      # ADDED / MODIFIED PLUGIN
      # --------------------------------------------------------------------------------------------

      else

        gcloud storage cp \
          "$(Build.SourcesDirectory)/airflow-practice/plugins/$relative_path" \
          "gs://${{ parameters.airflow_bucket }}/plugins/$relative_path"

      fi

    done
  displayName: 'Deploy Changed Plugin Files'