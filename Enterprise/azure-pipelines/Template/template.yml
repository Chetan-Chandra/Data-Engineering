parameters:
  - name: airflow_bucket
    type: string
  - name: gcp_secure_file
    type: string

steps:
  # ------------------------------------------------------------------------------------------------
  # 1. GCP AUTHENTICATION
  # ------------------------------------------------------------------------------------------------
  - task: DownloadSecureFile@1
    name: google_credentials
    inputs:
      secureFile: '${{ parameters.gcp_secure_file }}'
    displayName: 'Download GCP Service Account Key'

  - script: |
      chmod 600 $(google_credentials.secureFilePath)
      gcloud auth activate-service-account --key-file=$(google_credentials.secureFilePath)
    displayName: 'Authenticate with GCP'

  # ------------------------------------------------------------------------------------------------
  # 2. DEPLOY CHANGED DAG FILES
  # ------------------------------------------------------------------------------------------------
  - script: |
      echo "Target bucket: gs://${{ parameters.airflow_bucket }}"

      if git rev-parse HEAD~1 >/dev/null 2>&1; then
        BASE_COMMIT="HEAD~1"
      else
        BASE_COMMIT="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
      fi

      # Extract list of DAG changes
      dag_changes=$(git diff --name-status -M $BASE_COMMIT HEAD | grep -E '\sDAGS/' || true)

      if [ -z "$dag_changes" ]; then
        echo "=========================================="
        echo "INFO: No changed DAG files detected."
        echo "=========================================="
      else
        echo "=========================================="
        echo "Detected Changed DAG Files:"
        echo "$dag_changes"
        echo "=========================================="
        echo "Starting deployment of DAG files..."

        echo "$dag_changes" | while read -r line
        do
          status=$(echo "$line" | awk '{print $1}')

          if [[ "$status" == R* ]]; then
            old_path=$(echo "$line" | awk '{print $2}')
            new_path=$(echo "$line" | awk '{print $3}')

            if [[ "$old_path" != DAGS/* || "$new_path" != DAGS/* ]]; then
              continue
            fi

            old_relative="${old_path#DAGS/}"
            new_relative="${new_path#DAGS/}"

            echo "Renamed DAG: $old_relative -> $new_relative"

            gcloud storage rm "gs://${{ parameters.airflow_bucket }}/dags/$old_relative" --quiet || true
            gcloud storage cp "$(Build.SourcesDirectory)/DAGS/$new_relative" "gs://${{ parameters.airflow_bucket }}/dags/$new_relative"

          else
            file_path=$(echo "$line" | awk '{print $2}')

            if [[ "$file_path" != DAGS/* ]]; then
              continue
            fi

            relative_path="${file_path#DAGS/}"
            echo "DAG status: $status | $relative_path"

            if [[ "$status" == "D" ]]; then
              gcloud storage rm "gs://${{ parameters.airflow_bucket }}/dags/$relative_path" --quiet || true
            elif [[ "$status" == "A" || "$status" == "M" ]]; then
              gcloud storage cp "$(Build.SourcesDirectory)/DAGS/$relative_path" "gs://${{ parameters.airflow_bucket }}/dags/$relative_path"
            fi
          fi
        done
      fi
    displayName: 'Deploy Changed DAG Files'

  # ------------------------------------------------------------------------------------------------
  # 3. DEPLOY CHANGED PLUGIN FILES
  # ------------------------------------------------------------------------------------------------
  - script: |
      echo "Target bucket: gs://${{ parameters.airflow_bucket }}"

      if git rev-parse HEAD~1 >/dev/null 2>&1; then
        BASE_COMMIT="HEAD~1"
      else
        BASE_COMMIT="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
      fi

      # Extract list of plugin changes
      plugin_changes=$(git diff --name-status -M $BASE_COMMIT HEAD | grep -E '\splugins/' || true)

      if [ -z "$plugin_changes" ]; then
        echo "=========================================="
        echo "INFO: No changed plugin files detected."
        echo "=========================================="
      else
        echo "=========================================="
        echo "Detected Changed Plugin Files:"
        echo "$plugin_changes"
        echo "=========================================="
        echo "Starting deployment of plugin files..."

        echo "$plugin_changes" | while read -r line
        do
          status=$(echo "$line" | awk '{print $1}')

          if [[ "$status" == R* ]]; then
            old_path=$(echo "$line" | awk '{print $2}')
            new_path=$(echo "$line" | awk '{print $3}')

            if [[ "$old_path" != plugins/* || "$new_path" != plugins/* ]]; then
              continue
            fi

            old_relative="${old_path#plugins/}"
            new_relative="${new_path#plugins/}"

            echo "Renamed Plugin: $old_relative -> $new_relative"

            gcloud storage rm "gs://${{ parameters.airflow_bucket }}/plugins/$old_relative" --quiet || true
            gcloud storage cp "$(Build.SourcesDirectory)/plugins/$new_relative" "gs://${{ parameters.airflow_bucket }}/plugins/$new_relative"

          else
            file_path=$(echo "$line" | awk '{print $2}')

            if [[ "$file_path" != plugins/* ]]; then
              continue
            fi

            relative_path="${file_path#plugins/}"
            echo "Plugin status: $status | $relative_path"

            if [[ "$status" == "D" ]]; then
              gcloud storage rm "gs://${{ parameters.airflow_bucket }}/plugins/$relative_path" --quiet || true
            elif [[ "$status" == "A" || "$status" == "M" ]]; then
              gcloud storage cp "$(Build.SourcesDirectory)/plugins/$relative_path" "gs://${{ parameters.airflow_bucket }}/plugins/$relative_path"
            fi
          fi
        done
      fi
    displayName: 'Deploy Changed Plugin Files'